name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, type, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mhc
          POSTGRES_PASSWORD: mhc
          POSTGRES_DB: mhc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mhc"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://mhc:mhc@localhost:5432/mhc
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: memory://
      DJANGO_SECRET_KEY: test-only
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173
      ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy apps
      - run: pytest -q
      - run: python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend (lint, type, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Keyed on the lockfile, not package.json: a lockfile-only change
          # must invalidate the cache or CI installs stale transitive deps.
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Security (dependency scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend deps
        working-directory: backend
        run: |
          pip install pip-audit
          pip install -r requirements/base.txt
          pip-audit -r requirements/base.txt
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
