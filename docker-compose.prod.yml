# =============================================================================
# MHC e-Ticketing — production compose overrides
# Bring this up alongside the base compose:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this changes vs the dev profile:
#   * backend uses the prod settings module (HTTPS, hardened cookies, fail-fast secrets)
#   * frontend is built once and served by Nginx (no Vite dev server)
#   * Nginx terminates TLS and adds security headers
#   * RabbitMQ uses a non-guest user
#   * Redis is configured with a maxmemory policy and a slow log
#   * ClamAV does not download signatures (operators provide a pre-warmed image)
#   * MinIO versioning and object-lock-ready (off by default; toggle per bucket)
#   * Prometheus + Alertmanager + Grafana for the production observability stack
# =============================================================================

name: mhc-ticketing-prod

services:

  backend:
    image: mhc-ticketing-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      GUNICORN_WORKERS: "4"
      GUNICORN_THREADS: "4"
      GUNICORN_TIMEOUT: "60"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: https://${DOMAIN:?DOMAIN must be set}
      KEYCLOAK_ALLOWED_ISSUERS: https://${DOMAIN:?DOMAIN must be set}/realms/${KEYCLOAK_REALM:-mhc}
      MINIO_INTERNAL_URL: http://minio:9000
      MINIO_PUBLIC_URL: https://${FILES_DOMAIN:?FILES_DOMAIN must be set}
      PUBLIC_BASE_URL: https://${DOMAIN:?DOMAIN must be set}
      API_BASE_URL: https://${DOMAIN:?DOMAIN must be set}
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?DOMAIN must be set},backend,localhost
      DJANGO_CORS_ALLOWED_ORIGINS: https://${DOMAIN:?DOMAIN must be set}
    ports: !reset []
    volumes: !reset []
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: ["gunicorn", "-c", "gunicorn.conf.py", "config.wsgi:application"]

  worker:
    image: mhc-ticketing-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=INFO", "--concurrency=4"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping -t 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    volumes: !reset []

  beat:
    image: mhc-ticketing-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: ["celery", "-A", "config.celery", "beat", "--loglevel=INFO"]
    restart: unless-stopped
    volumes: !reset []

  postgres:
    ports: !reset []

  minio:
    ports: !reset []

  clamav:
    ports: !reset []

  keycloak:
    image: mhc-ticketing-keycloak:26.7.0
    build:
      context: ./infrastructure/keycloak
      dockerfile: Dockerfile
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mhc}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-mhc}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://${DOMAIN:?DOMAIN must be set}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      LOCAL_BASE_URL: https://${DOMAIN:?DOMAIN must be set}
      LAN_BASE_URL: https://${DOMAIN:?DOMAIN must be set}
      PUBLIC_BASE_URL: https://${DOMAIN:?DOMAIN must be set}
    depends_on:
      postgres:
        condition: service_healthy
    ports: !reset []
    volumes: !override
      - ./infrastructure/keycloak/realm-mhc.json:/opt/keycloak/data/import/realm-mhc.json:ro

  frontend:
    image: mhc-ticketing-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production   # multi-stage build (see frontend/Dockerfile)
    profiles: ["never"]   # production frontend is served by Nginx from the image's static dir
    restart: "no"

  frontend-assets:
    image: mhc-ticketing-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NPM_CONFIG_STRICT_SSL: ${NPM_CONFIG_STRICT_SSL:-true}
        VITE_API_BASE_URL: ""
        VITE_KEYCLOAK_URL: https://${DOMAIN:?DOMAIN must be set}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-mhc}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-mhc-frontend}
    restart: "no"
    volumes:
      - frontend-static:/output

  nginx:
    image: mhc-ticketing-nginx:1.28.3
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
      FILES_DOMAIN: ${FILES_DOMAIN:?FILES_DOMAIN must be set}
      NGINX_ENVSUBST_FILTER: ^(DOMAIN|FILES_DOMAIN)$
    depends_on:
      backend:
        condition: service_healthy
      frontend-assets:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    ports:
      - "443:443"
      - "80:80"     # redirect-only; see infrastructure/nginx/
    volumes:
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - frontend-static:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  rabbitmq:
    ports: !reset []
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    # Operators should also add: RABBITMQ_LOGS=-, RABBITMQ_USE_LONGNAME=true
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    ports: !reset []
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--slowlog-log-slower-than"
      - "10000"
      - "--slowlog-max-len"
      - "128"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports: !override
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports: !override
      - "127.0.0.1:3000:3000"

volumes:
  prometheus-data:
  grafana-data:
  frontend-static:
    # Populated by `frontend/Dockerfile` (production target)
