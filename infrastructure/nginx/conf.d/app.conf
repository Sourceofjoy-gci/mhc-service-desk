# Rendered by the official Nginx entrypoint. Substitution is restricted to
# DOMAIN and FILES_DOMAIN so native Nginx variables remain intact.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / { return 444; }
}

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} ${FILES_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name ${DOMAIN};

    if ($host != "${DOMAIN}") { return 444; }

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location = /api/v1/health/live {
        access_log off;
        proxy_pass http://django_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/v1/health {
        access_log off;
        proxy_pass http://django_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/v1/tickets/public/intake/ {
        limit_req zone=intake_rl burst=10 nodelay;
        proxy_pass http://django_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 25m;
    }

    location ~ ^/api/v1/integrations/ {
        proxy_pass http://django_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=api_rl burst=60 nodelay;
        proxy_pass http://django_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Keep the administration realm off the public edge.
    location ~ ^/realms/master(?:/|$) { return 404; }

    location /realms/ {
        proxy_pass http://keycloak:8080;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /resources/ {
        proxy_pass http://keycloak:8080;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* \.map$ { return 404; }

    location ~ /\.(?!well-known) { return 404; }

    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}

# Browser-facing, signed attachment delivery. The Host header is preserved so
# MinIO can validate SigV4 URLs generated for FILES_DOMAIN.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${FILES_DOMAIN};

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition "attachment" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Set-Cookie;
        proxy_request_buffering off;
    }
}
