user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    charset utf-8;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main buffer=32k flush=5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;
    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # --- Rate limit zones (per PRD §23.2) ---------------------------------
    limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=intake_rl:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=login_rl:10m rate=10r/m;
    limit_req_status 429;

    # --- Connection limits -----------------------------------------------
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # --- Upstream --------------------------------------------------------
    upstream django_backend {
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
