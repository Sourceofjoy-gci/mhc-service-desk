global:
  resolve_timeout: 5m

route:
  receiver: ops-default
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: pagerduty
      continue: true
    - matchers: [severity="warning"]
      receiver: slack
      continue: true

receivers:
  - name: ops-default
    webhook_configs:
      - url: http://alertmanager:9093/-/reload  # placeholder; ops wires real

  - name: pagerduty
    pagerduty_configs:
      - service_key: ${PAGERDUTY_SERVICE_KEY}
        description: "{{ .GroupLabels.alertname }} — {{ .CommonAnnotations.summary }}"

  - name: slack
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: "#mhc-ticketing-ops"
        title: "{{ .GroupLabels.alertname }}"
        text: "{{ .CommonAnnotations.summary }}"
