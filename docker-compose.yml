# =============================================================================
# MHC Unified e-Ticketing — local development stack
# P0 baseline (PRD §24). Production profile documented separately.
# =============================================================================
name: mhc-ticketing

services:

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mhc}
      POSTGRES_USER: ${POSTGRES_USER:-mhc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mhc} -d ${POSTGRES_DB:-mhc}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET:-mhc-attachments} || true &&
      mc version enable local/${MINIO_BUCKET:-mhc-attachments} &&
      mc anonymous set none local/${MINIO_BUCKET:-mhc-attachments} &&
      echo 'MinIO bucket ready'
      "
    restart: "no"

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck || (nc -z localhost 3310 && echo OK)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-http://localhost:5173}
      LAN_BASE_URL: ${LAN_BASE_URL:-http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infrastructure/keycloak/realm-mhc.json:/opt/keycloak/data/import/realm-mhc.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.dev
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      KEYCLOAK_ALLOWED_ISSUERS: ${LOCAL_BASE_URL:-http://localhost:5173}/realms/${KEYCLOAK_REALM:-mhc},${LAN_BASE_URL:-http://localhost:5173}/realms/${KEYCLOAK_REALM:-mhc},${PUBLIC_BASE_URL:-http://localhost:5173}/realms/${KEYCLOAK_REALM:-mhc}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["./scripts/dev.sh"]
    volumes:
      - ./backend:/app
      - ./infrastructure:/infrastructure:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      backend:
        condition: service_started
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=INFO", "--concurrency=4"]
    volumes:
      - ./backend:/app

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-/}
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      backend:
        condition: service_started
    command: ["celery", "-A", "config.celery", "beat", "--loglevel=INFO"]
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        NPM_CONFIG_STRICT_SSL: ${NPM_CONFIG_STRICT_SSL:-true}
    restart: unless-stopped
    env_file: .env
    environment:
      # Browser traffic stays on the origin that served the app. Vite proxies
      # these paths over Docker's private network, so no workstation IP is
      # baked into the frontend bundle.
      VITE_API_BASE_URL: ""
      API_PROXY_TARGET: http://backend:8000
      VITE_KEYCLOAK_URL: same-origin
      KEYCLOAK_PROXY_TARGET: http://keycloak:8080
      VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      VITE_DEV_AUTH: ${VITE_DEV_AUTH:-0}
      NPM_CONFIG_STRICT_SSL: ${NPM_CONFIG_STRICT_SSL:-true}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"
    command: ["sh", "-c", "set -eu; LOCK_HASH=$$(sha256sum package-lock.json | cut -d ' ' -f 1); if [ ! -f node_modules/.mhc-package-lock-hash ] || [ \"$$(cat node_modules/.mhc-package-lock-hash 2>/dev/null)\" != \"$$LOCK_HASH\" ]; then npm install --no-audit --no-fund --legacy-peer-deps; printf '%s' \"$$LOCK_HASH\" > node_modules/.mhc-package-lock-hash; fi; exec npm run dev -- --host 0.0.0.0"]
    volumes:
      # Keep source and dependencies on Docker's Linux filesystem. Bind mounts
      # from Windows can leave Vite blocked in uninterruptible file I/O.
      - frontend-node-modules:/app/node_modules
    # Without a source bind mount the container serves whatever was baked into
    # the image, so edits stay invisible until a rebuild. `docker compose watch`
    # copies changed files in instead of mounting them: Vite's watcher sees a
    # real filesystem event inside the container, so HMR works without exposing
    # the dev server to Windows bind-mount I/O. Run `make watch`, not `make up`,
    # while working on the frontend.
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        # Vite restarts itself when its own config changes, but only once the
        # new file is actually inside the container.
        - action: sync+restart
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        # Dependency changes need a real install, which the entrypoint performs
        # when the lockfile hash stops matching the one recorded in the volume.
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    profiles: ["observability"]

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  clamav-data:
  keycloak-data:
  prometheus-data:
  grafana-data:
  frontend-node-modules:
